name: Keep Supabase awake

# Supabase pauses free projects after about a week without activity. A weekly
# ping was not enough (GitHub delays scheduled runs by hours and the project was
# paused on 2026-11-08), so this makes one small database request every day.
on:
  schedule:
    - cron: '17 6 * * *' # every day 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the database
        run: |
          source .env.production
          URL=$VITE_SUPABASE_URL
          KEY=$VITE_SUPABASE_ANON_KEY
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/signup_open" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
      # GitHub switches off scheduled workflows after 60 days without commits.
      # Re-enabling this workflow on every run keeps the schedule alive.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-supabase-awake.yml/enable"
